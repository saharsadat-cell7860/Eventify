<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking | Eventify</title>
        <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>
<body>
     <!-- Navbar -->
    <header class="header">
        <nav class="navbar container">

            <a href="index.html" class="logo">
                Event<span>ify.</span>
            </a>

            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="events.html">Explore Events</a>
                <a href="event-details.html">Event Details</a>
                <a href="booking.html" class="active">Booking</a>
                <a href="my-tickets.html">My Tickets</a>
            </div>

            <div class="nav-actions">

                <a href="my-tickets.html" class="favorite-link">
                    <i class="far fa-heart"></i>
                    <span id="favoriteCount">0</span>
                </a>

                <a href="booking.html" class="nav-btn">
                    Book Now
                </a>

                <button class="menu-toggle" id="menuToggle"
                    aria-label="Toggle navigation"
                    aria-expanded="false">
                    <i class="fas fa-bars"></i>
                </button>

            </div>

        </nav>
    </header>
<!-- Booking Hero -->
    <section class="booking-hero">

        <div class="container">

            <div class="breadcrumb">
                <a href="index.html">Home</a>
                <i class="fas fa-angle-right"></i>
                <a href="events.html">Events</a>
                <i class="fas fa-angle-right"></i>
                <span>Booking</span>
            </div>

            <h1>Complete Your <span>Booking</span></h1>

            <p>
                Just a few steps away from your next unforgettable experience.
            </p>

        </div>

    </section>


    <!-- Booking Section -->
    <main class="container booking-section" id="bookingSection">

        <div class="booking-layout">

            <!-- Booking Form -->
            <div class="booking-form-container">

                <div class="booking-heading">
                    <span class="section-tag">YOUR INFORMATION</span>
                    <h2>Personal <span>Details</span></h2>
                    <p>Please enter your information to complete your booking.</p>
                </div>


                <form id="bookingForm" novalidate>

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="customerName">Full Name</label>

                        <div class="booking-input">
                            <i class="far fa-user"></i>

                            <input
                                type="text"
                                id="customerName"
                                placeholder="Enter your full name"
                                autocomplete="name"
                            >
                        </div>

                        <small class="form-error" id="nameError"></small>
                    </div>

   <!-- Email -->
                    <div class="form-group">
                        <label for="customerEmail">Email Address</label>

                        <div class="booking-input">
                            <i class="far fa-envelope"></i>
                            <input
                                type="email"
                                id="customerEmail"
                                placeholder="example@email.com"
                                autocomplete="email"
                            >
                        </div>

                        <small class="form-error" id="emailError"></small>
                    </div>


</body>
</html>
