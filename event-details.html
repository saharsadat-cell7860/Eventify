<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Details | Eventify</title>
    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar -->
    <header class="header">
      <nav class="navbar container">
        <a href="index.html" class="logo"> Event<span>ify.</span> </a>

        <div class="nav-links" id="navLinks">
          <a href="index.html">Home</a>
          <a href="events.html">Explore Events</a>
          <a href="event-details.html" class="active">Event Details</a>
          <a href="booking.html">Booking</a>
          <a href="my-tickets.html">My Tickets</a>
        </div>

        <div class="nav-actions">
          <a href="my-tickets.html" class="favorite-link">
            <i class="far fa-heart"></i>
            <span id="favoriteCount">0</span>
          </a>

          <a href="booking.html" class="nav-btn"> Book Now </a>

          <button
            class="menu-toggle"
            id="menuToggle"
            aria-label="Toggle navigation"
            aria-expanded="false"
          >
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </nav>
    </header>
    <!-- Page Header -->
    <section class="details-hero">
        <div class="container">
            <p class="breadcrumb">
                <a href="index.html">Home</a>
                <i class="fas fa-angle-right"></i>
                <a href="events.html">Events</a>
                <i class="fas fa-angle-right"></i>
                <span>Event Details</span>
            </p>

            <h1>Event <span>Details</span></h1>
            <p>Discover everything you need to know about this event.</p>
        </div>
    </section>

    <!-- Event Details -->
    <main class="container details-section">

        <div id="eventDetailsContent">

            <div class="details-layout">

                <!-- Event Image -->
                <div class="details-image">
                    <img id="detailImage" src="" alt="Event image">
                    <span class="details-category" id="detailCategory"></span>
                </div>

                <!-- Event Information -->
                <div class="details-info">

                    <h2 id="detailName">Loading event...</h2>

                    <p class="details-description" id="detailDescription"></p>

                    <div class="details-meta">

                        <div class="meta-item">
                            <i class="far fa-calendar-alt"></i>
                            <div>
                                <small>Date</small>
                                <p id="detailDate"></p>
                            </div>
                        </div>

                        <div class="meta-item">
                            <i class="far fa-clock"></i>
                            <div>
                                <small>Time</small>
                                <p id="detailTime"></p>
                            </div>
                        </div>

                        <div class="meta-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <div>
                                <small>Location</small>
                                <p id="detailLocation"></p>
                            </div>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-ticket-alt"></i>
                            <div>
                                <small>Available Tickets</small>
                                <p id="detailAvailable"></p>
                            </div>
                        </div>

                    </div>

                    <!-- Ticket Selection -->
                    <div class="ticket-selection">

                        <div class="ticket-price">
                            <small>Price per ticket</small>
                            <h2 id="detailPrice">$0</h2>
                        </div>

                        <div class="quantity-control">
                            <button id="decreaseBtn" aria-label="Decrease tickets">
                                <i class="fas fa-minus"></i>
                            </button>

                            <span id="ticketQuantity">1</span>

                            <button id="increaseBtn" aria-label="Increase tickets">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>

                    </div>

  </body>
</html>
